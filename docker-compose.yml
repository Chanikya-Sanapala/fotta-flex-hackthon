services:
  postgres:
    image: postgres:16-alpine
    container_name: logistics-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: logistics_db
      POSTGRES_USER: logistics_admin
      POSTGRES_PASSWORD: logistics_dev_password
    ports:
      - "5432:5432"
    volumes:
      - logistics_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U logistics_admin -d logistics_db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  logistics_postgres_data:
